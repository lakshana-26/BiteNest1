<!DOCTYPE html>
<html>
<head>
    <title>BiteNest - Food Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍽️ BiteNest</h1>
        <p>South Indian food for your mood!</p>
    </header>
    <section class="mood">
        <h2>What's your mood today?</h2>
        <button onclick="showFood('breakfast')">🌅 Breakfast</button>
        <button onclick="showFood('hungry')">😋 Hungry</button>
        <button onclick="showFood('comfort')">❤️ Comfort</button>
        <button onclick="showFood('all')">🍽️ Show All</button>
    </section>
    <section>
        <input type="text" id="search"
               placeholder="Search your favourite food..."
               onkeyup="searchFood()">
    </section>
    <section>
        <h2>Today's Food</h2>
        <div id="foodContainer" class="food-container"></div>
    </section>
    <section class="cart">
        <h2>🛒 Your Cart</h2>

        <div id="cartContainer"></div>

        <h3 id="total">Total: ₹0</h3>

        <h3>💵 Payment Method</h3>

        <label>
            <input type="radio" checked>
            Cash on Delivery (COD)
        </label>
        <br><br>
        <button onclick="placeOrder()">
            Place Order
        </button>
    </section>
    <footer>
        <p>© 2026 BiteNest | Fresh South Indian Food ❤️</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
